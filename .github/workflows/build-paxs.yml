name: Build PAXs

on:
  push:
    branches: [main]
    paths: ["papp2-packages/**", "tools/build_papp2_dist.py", "tests/test_launcher_store.py", "tests/test_store_expansion.py", "tests/test_external_assets.py", "tools/prepare_anotherworld_data.py", "tools/prepare_stargus_sd.py", "tools/make_listing.py", ".github/workflows/build-paxs.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Launcher UI store recipe
        run: python3 -m unittest discover -s tests -p 'test_launcher_store.py'

      - name: Check added store recipes and private-data exclusions
        run: python3 -m unittest discover -s tests -p 'test_store_expansion.py'

      - name: Check external game-asset readers
        run: |
          python3 -m unittest discover -s tests -p 'test_external_assets.py'
          python3 -m unittest discover -s tests -p 'test_external_asset_preparation.py'

      - name: Validate and stage PAPP2 packages
        run: python3 tools/build_papp2_dist.py --out dist

      - name: Summary
        shell: bash
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          apps = json.load(open("dist/build.json"))["apps"]
          print("| App | Version | ABI | Size | sha256 |")
          print("|---|---|---:|---:|---|")
          for a in apps:
              print(f"| {a['file']} | {a['version']} | {a['abi']} | {a['size']:,} | `{a['sha256'][:16]}` |")
          EOF

      # Publish store refuses a new binary under an already released version.
      # Catch that here, before merge: compare with the live store.
      - name: Changed binaries have a new version
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, sys, urllib.request
          try:
              with urllib.request.urlopen("https://nonasuomy.github.io/esphomebrew/store.json", timeout=30) as r:
                  published = {(a["name"], a["version"]): a["sha256"] for a in json.load(r)["apps"]}
          except Exception as error:  # first publish, or Pages unreachable: nothing to compare
              print(f"store.json not available ({error}); skipping")
              sys.exit(0)
          bad = []
          for a in json.load(open("dist/build.json"))["apps"]:
              old = published.get((a["name"], a["version"]))
              if old and old != a["sha256"]:
                  bad.append(f"{a['name']} {a['version']}: published {old[:12]}, built {a['sha256'][:12]}")
          for line in bad:
              print(f"::error::{line}. Bump \"version\" in papp2-packages/{line.split()[0]}.json.")
          sys.exit(1 if bad else 0)
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: paxs
          path: dist/
          if-no-files-found: error
