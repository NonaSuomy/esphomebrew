name: ESPHome config

on:
  push:
    branches: [main]
    paths: ["esphome/**", "tools/firmware_ci.py", "tools/firmware-config.py", "web-installer/boards.json", "tests/test_firmware_web_progress.py", "tests/test_firmware_web_progress.cjs", ".github/workflows/esphome-config.yml"]
  pull_request:
    paths: ["esphome/**", "tools/firmware_ci.py", "tools/firmware-config.py", "web-installer/boards.json", "tests/test_firmware_web_progress.py", "tests/test_firmware_web_progress.cjs", ".github/workflows/esphome-config.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install PyYAML==6.0.3
      - name: Retain SD setup progress completion regressions
        run: |
          python tests/test_firmware_web_progress.py
          node tests/test_firmware_web_progress.cjs
          python esphome/tests/test_firmware_update.py
      - name: Check Wi-Fi transitions, backup, scanning and DHCP
        run: |
          python -m unittest discover -s esphome/tests -p 'test_wifi*.py'
          python -m unittest discover -s esphome/tests -p test_network_dns.py
          python -m unittest discover -s esphome/tests -p test_network_interface.py
          python -m unittest discover -s esphome/tests -p test_supply_bootstrap.py
      - name: Validate every public profile and credential-free include closure
        run: python tools/firmware_ci.py matrix
      - name: Validate publication guards
        run: python -m unittest discover -s tests -p test_firmware_ci.py -v
      # Real ESPHome schema validation, generation and compilation run for each
      # profile in Build device firmware using the pinned patched runtime.
