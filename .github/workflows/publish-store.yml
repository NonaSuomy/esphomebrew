name: Publish store

# After "Build PAXs" succeeds on main: one GitHub Release per app version
# (tag <name>-v<version>, asset <name>-<version>.pax), then the Pages catalog
# the device's pax_loader catalog_url points at.
on:
  # Website-only repairs can reuse the latest successful build on main.
  push:
    branches: [main]
    paths: ["tools/make_catalog.py", "tests/test_make_catalog.py", ".github/workflows/publish-store.yml", "web-installer/**", "tools/check_web_installer.py", "web-store/**", "tests/test_store_install.cjs"]
  workflow_run:
    workflows: [Build PAXs]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build PAXs run to publish (default: the newest successful build on main)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: publish-store
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # The newest successful build on main, not necessarily the one that
      # triggered this run: two merges build side by side, and when the older
      # commit's build finished last its publish put the older app versions
      # back in the store (NetSurf went from 0.2.3 back to 0.2.2). The queue
      # above runs publishes one at a time, so the last one always publishes
      # the newest build. A manual run_id still picks a run on purpose.
      - name: Pick the build run
        id: run
        shell: bash
        run: |
          id="${{ inputs.run_id }}"
          if [ -z "$id" ]; then
            id=$(gh run list -R "$REPO" --branch main --event push --status success --limit 100 --json databaseId,workflowName --jq '[.[] | select(.workflowName == "Build PAXs" or .workflowName == "Build PAPPs")][0].databaseId')
          fi
          trigger="${{ github.event.workflow_run.id }}"
          if [ -n "$trigger" ] && [ "$trigger" != "$id" ]; then
            echo "Build run $trigger finished, but $id is a newer successful build on main: publishing that one."
          fi
          echo "artifact=$(gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name == "paxs" or .name == "papps") | .name' | head -1)" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "sha=$(gh run view "$id" -R "$REPO" --json headSha --jq .headSha)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(gh run view "$id" -R "$REPO" --json startedAt --jq .startedAt)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.run.outputs.artifact }}
          path: dist
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}

      - name: Release each app version
        shell: bash
        run: |
          python3 - <<'EOF' > releases.tsv
          import json
          for a in json.load(open("dist/build.json"))["apps"]:
              if not a.get("publish", True):
                  continue  # work in progress, not released
              print(f"{a['name']}\t{a['version']}\t{a['sha256']}\t{a['title']}\t{a['file']}")
          EOF
          while IFS=$'\t' read -r name version sha title source_file; do
            tag="$name-v$version"; asset="$name-$version.pax"
            cp "dist/$source_file" "$asset"
            if gh release view "$tag" -R "$REPO" > /dev/null 2>&1; then
              published=$(gh release view "$tag" -R "$REPO" --json body --jq .body | sed -n 's/^sha256: //p' | head -1)
              if [ "$published" = "$sha" ]; then
                if ! gh release view "$tag" -R "$REPO" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                  gh release upload "$tag" "$asset" -R "$REPO"
                fi
                echo "$tag already published with the same binary; PAX asset available"
                continue
              fi
              echo "::error::$tag is already published with a different binary ($published). Bump \"version\" in apps/$name/pax.json."
              exit 1
            fi
            gh release create "$tag" "$asset" -R "$REPO" --target "${{ steps.run.outputs.sha }}" \
              --title "$title $version" \
              --notes "$(printf 'PAX `%s` %s, built by CI from %s.\n\nsha256: %s\n' "$name" "$version" "${{ steps.run.outputs.sha }}" "$sha")"
          done < releases.tsv

      # App data (game WADs/PAKs) is pinned by sha256, so cached copies are
      # checked and reused instead of downloaded again on every publish.
      - uses: actions/cache@v4
        with:
          path: .data-cache
          key: pax-data-${{ hashFiles('apps/*/pax.json') }}
          restore-keys: pax-data-

      - name: Write catalog and app data
        run: python3 tools/make_catalog.py --repo "$REPO" --dist dist --out site --data-cache .data-cache --built-at "${{ steps.run.outputs.built_at }}"

      - name: Add browser app installer
        run: |
          node tests/test_store_install.cjs
          cp web-store/store-install.js site/store-install.js

      - name: Add browser firmware installer
        run: |
          mkdir -p site/install
          cp -a web-installer/. site/install/
          python3 tools/check_web_installer.py site/install

      - name: Validate PAX catalog downloads and JSON sidecars
        run: |
          python3 - <<'EOF'
          import hashlib, json, re
          from pathlib import Path
          site = Path("site")
          apps = json.loads((site / "store.json").read_text())["apps"]
          page = (site / "index.html").read_text()
          links = re.findall(r'href="([^"<>]+\.pax)"', page)
          assert apps and len(links) == len(apps), "Empty or incomplete PAX catalog"
          assert not re.search(r'href="[^"<>]+\.papp"', page), "Legacy package links in PAX catalog"
          for app in apps:
              name = app["file"]
              assert name.endswith(".pax") and name in links, name
              assert app["built_at"] > 0, name
              assert f'data-pax-size="{app["size"]}"' in page, name
              assert f'data-pax-mtime="{app["built_at"]}"' in page, name
              package = site / name
              assert package.stat().st_size == app["size"], name
              assert hashlib.sha256(package.read_bytes()).hexdigest() == app["sha256"], name
              assert json.loads(package.with_suffix(".json").read_text()) == app, name
              if app.get("data"):
                  assert (site / name.replace(".pax", ".files")).read_text().startswith("# pax-data 1\n"), name
          print(f"Validated {len(apps)} PAX downloads, hashes and JSON sidecars")
          EOF

      # Provision/read the repository's Pages site before deploying the artifact.
      # This makes a newly created release repository work without a manual
      # first deployment from the Pages settings screen.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # One artifact name per attempt: a re-run keeps the earlier attempt's
      # artifact, and deploy-pages refuses when two share a name.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
