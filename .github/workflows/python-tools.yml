name: Python tools

on:
  push:
    branches: [main]
    paths: ["tools/esp_bridge/**", "tools/device_bridge/**", "tools/build_pax.py", "tools/make_catalog.py", "apps/**", "esphome/components/pax_loader/pax_data.h", "esphome/components/pax_loader/pax_canvas.h", "esphome/components/pax_loader/pax_handoff.h", "esphome/components/pax_loader/pax_files.h", "esphome/components/pax_loader/pax_memory.h", "tools/make_listing.py", "tests/**", ".github/workflows/python-tools.yml"]
  pull_request:
    paths: ["tools/esp_bridge/**", "tools/device_bridge/**", "tools/build_pax.py", "tools/make_catalog.py", "apps/**", "esphome/components/pax_loader/pax_data.h", "esphome/components/pax_loader/pax_canvas.h", "esphome/components/pax_loader/pax_handoff.h", "esphome/components/pax_loader/pax_files.h", "esphome/components/pax_loader/pax_memory.h", "tools/make_listing.py", "tests/**", ".github/workflows/python-tools.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML==6.0.3
      - run: python -m unittest discover -s tests -v

      # The loader's data-list parser and SHA-256 are plain C++; test them on the host.
      - name: pax_data.h host tests
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -O2 -I esphome/components/pax_loader tests/cpp/test_pax_data.cpp -o "$RUNNER_TEMP/test_pax_data"
          "$RUNNER_TEMP/test_pax_data"

      # Canvas geometry (where an app's canvas and the close control go, sizes, per-app keys).
      - name: pax_canvas.h host tests
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -O2 -I esphome/components/pax_loader tests/cpp/test_pax_canvas.cpp -o "$RUNNER_TEMP/test_pax_canvas"
          "$RUNNER_TEMP/test_pax_canvas"

      # App hand-off (app_open): target names, catalog matches, the return stack.
      - name: pax_handoff.h host tests
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -O2 -I esphome/components/pax_loader tests/cpp/test_pax_handoff.cpp -o "$RUNNER_TEMP/test_pax_handoff"
          "$RUNNER_TEMP/test_pax_handoff"

      # File services and the store's file checks: allowed paths, patterns, required files.
      - name: pax_files.h host tests
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -O2 -I esphome/components/pax_loader tests/cpp/test_pax_files.cpp -o "$RUNNER_TEMP/test_pax_files"
          "$RUNNER_TEMP/test_pax_files"

      # Where an app's heap goes: PSRAM, and internal RAM only above the drivers' reserve.
      - name: pax_memory.h host tests
        run: |
          g++ -std=gnu++17 -Wall -Wextra -Werror -O2 -I esphome/components/pax_loader tests/cpp/test_pax_memory.cpp -o "$RUNNER_TEMP/test_pax_memory"
          "$RUNNER_TEMP/test_pax_memory"

      # Download every pinned app data file and check its size and sha256, so a
      # bad pin fails here instead of in Publish store on main.
      - name: Verify pinned app data
        shell: python
        run: |
          import json, pathlib, sys, tempfile
          sys.path.insert(0, "tools")
          import build_pax, make_catalog
          for path in sorted(pathlib.Path("apps").glob("*/pax.json")):
              app = json.loads(path.read_text())
              data = build_pax.check_data(app["name"], app.get("data"))
              if data:
                  with tempfile.TemporaryDirectory() as tmp:
                      make_catalog.publish_data("o/r", {**app, "data": data}, pathlib.Path(tmp), None)
                  print(f"{app['name']}: {len(data['files'])} file(s) verified")
