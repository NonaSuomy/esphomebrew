# Experimental hardware profile. See docs/boards.md and board-sources.json.
sd_mmc_card:
  id: sd_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  mode_1bit: true
  slot: 0
i2c:
- id: bsp2_bus
  sda: GPIO07
  scl: GPIO08
  frequency: 400kHz
  sda_pullup_enabled: false
  scl_pullup_enabled: false
i2s_audio:
- id: i2s_output
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO12
  i2s_mclk_pin: GPIO13
audio_dac:
- platform: es8311
  id: speaker_codec
  i2c_id: bsp2_bus
  address: 24
  sample_rate: 48000
  bits_per_sample: 16bit
  use_mclk: true
speaker:
- platform: i2s_audio
  id: speaker_output
  i2s_audio_id: i2s_output
  dac_type: external
  i2s_dout_pin: GPIO9
  audio_dac: speaker_codec
  channel: stereo
  buffer_duration: 100ms
  timeout: 5s
  bits_per_sample: 16bit
  sample_rate: 48000
switch:
- platform: gpio
  pin:
    number: GPIO11
    inverted: false
  name: Speaker Enable
  id: speaker_enable
  internal: true
  restore_mode: ALWAYS_ON
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  clk:
    pin: GPIO50
    mode: CLK_EXT_IN
  phy_addr: 1
  power_pin: GPIO51

logger:
  hardware_uart: USB_SERIAL_JTAG

esp32:
  flash_size: 16MB
  engineering_sample: true
  cpu_frequency: 360MHz
esp_ldo:
- channel: 3
  voltage: 2.5V
- channel: 4
  voltage: 2.7V
output:
- platform: ledc
  pin: GPIO23
  id: backlight_pwm
  frequency: 1000Hz
light:
- platform: monochromatic
  output: backlight_pwm
  id: display_backlight
  internal: true
  restore_mode: ALWAYS_ON
  gamma_correct: 1.0
  default_transition_length: 0s
display:
- platform: mipi_dsi
  id: main_display
  transform: disabled
  model: JC1060P470
  reset_pin: GPIO0
  update_interval: never
  auto_clear_enabled: false
  show_test_card: false
touchscreen:
- platform: gt911
  id: touch_panel
  i2c_id: bsp2_bus
  display: main_display
  update_interval: 50ms
pax_loader:
  touchscreen_id: touch_panel

packages:
  networking: !include ../../packages/pax-network-dual.yaml
  hosted_wifi: !include ../../packages/pax-hosted-c6-sdio.yaml
  pax_presentation: !include ../../displays/jc1060-pax-native.yaml

esphome:
  platformio_options:
    board_build.flash_mode: dio
