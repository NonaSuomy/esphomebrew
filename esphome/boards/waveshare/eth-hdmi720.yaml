# Experimental hardware; see docs/boards.md.
packages:
  panel: !include ../../displays/hdmi720.yaml

esp_ldo:
- channel: 3
  voltage: 2.5V
- channel: 4
  voltage: passthrough

sd_mmc_card:
  id: sd_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  mode_1bit: true
  slot: 1
  power_ctrl_pin: GPIO45

i2c:
- id: bsp2_bus
  sda: GPIO07
  scl: GPIO08
  frequency: 400kHz

switch:
- platform: gpio
  pin:
    number: GPIO53
    inverted: false
  name: Speaker Enable
  id: speaker_enable
  internal: true
  restore_mode: ALWAYS_ON

i2s_audio:
- id: i2s_output
  i2s_lrclk_pin: GPIO10
  i2s_bclk_pin: GPIO12
  i2s_mclk_pin: GPIO13

audio_dac:
- platform: es8311
  id: speaker_codec
  i2c_id: bsp2_bus
  address: 24
  sample_rate: 48000
  bits_per_sample: 16bit
  use_mclk: true

esp32:
  flash_size: 32MB
  engineering_sample: true

speaker:
- platform: i2s_audio
  id: speaker_output
  i2s_audio_id: i2s_output
  dac_type: external
  i2s_dout_pin: GPIO9
  audio_dac: speaker_codec
  channel: stereo
  buffer_duration: 100ms
  timeout: 5s
  bits_per_sample: 16bit
  sample_rate: 48000

ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1

