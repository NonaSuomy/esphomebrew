# Remote control for the PAX loader over the ESPHome native API.
#
# Adds API actions that the ESP bridge (tools/esp_bridge), the helper in
# tools/pax_device.py, or Home
# Assistant can call:
#   pax_launch(url)       stream and start a .pax from a URL
#   pax_launch_rom(emulator, rom)
#                          select an emulator PAX and a local game path
#                          under /sd or /usb0, then start it
#   pax_install_url(url, name, size, digest)
#                            verify and save a .pax under /sd/roms/pax
#   pax_upload_file(url, path, size, digest)
#                            verify and save any file under a path below /sd
#   pax_close()           close the running PAX
#   pax_refresh_catalog() reload the store catalog
#   pax_screenshot()      send one 800x480 capture of the running PAX to the
#                          diagnostic stream on TCP port 3233 (bridge `screenshot`)
#   pax_read_file(path)   send one SD card file under /sd/ (or a listing, for a
#                          path ending in /) to the same stream (bridge `readfile`)
#   pax_write_file(path, data)
#                          replace a small text file under /sd/ (.ini, .cfg, .txt,
#                          .json, ...), keeping the old one as .bak; refused while
#                          an app runs (bridge `writefile`)
#   pax_delete_file(path) remove one of those files, or a leftover .bak/.log,
#                          under /sd/; refused while an app runs (bridge `deletefile`)
#
# The central packages/pax-base.yaml includes this local package. To use the
# same actions from another entry point in this directory:
#
# packages:
#   pax_control: !include device_control.yaml
#
substitutions:
  idf_source: !env_var PAX_IDF_SOURCE
  idf_compat_script: !env_var PAX_IDF_COMPAT
  pax_loader_id: pax_runtime

api:
  actions:
    - action: pax_launch
      variables:
        url: string
      then:
        - pax_loader.launch_url:
            id: ${pax_loader_id}
            url: !lambda return url;
    - action: pax_launch_with_arg
      variables:
        path: string
        arg: string
      then:
        - lambda: id(${pax_loader_id}).request_launch_with_arg(path, arg);
    - action: pax_launch_rom
      variables:
        emulator: string
        rom: string
      then:
        - pax_loader.launch_rom:
            id: ${pax_loader_id}
            emulator: !lambda return emulator;
            rom: !lambda return rom;
    - action: pax_install_url
      variables:
        url: string
        name: string
        size: int
        digest: string
      then:
        - lambda: |-
            id(${pax_loader_id})->request_install_url(url, name, static_cast<uint32_t>(size), digest);
    - action: pax_upload_file
      variables:
        url: string
        path: string
        size: int
        digest: string
      then:
        - lambda: |-
            id(${pax_loader_id})->request_upload_url(url, path, static_cast<uint32_t>(size), digest);
    - action: pax_close
      then:
        - lambda: id(${pax_loader_id})->request_close();
    - action: pax_refresh_catalog
      then:
        - lambda: id(${pax_loader_id})->refresh_catalog();
    - action: pax_screenshot
      then:
        - lambda: id(${pax_loader_id})->request_screenshot();
    - action: pax_read_file
      variables:
        path: string
      then:
        - lambda: id(${pax_loader_id})->request_file(path);
    - action: pax_write_file
      variables:
        path: string
        data: string
      then:
        - lambda: id(${pax_loader_id})->write_file(path, data);
    - action: pax_delete_file
      variables:
        path: string
      then:
        - lambda: id(${pax_loader_id})->delete_file(path);

# Local browser setup and SD transfers share the loader used by the debug API.
pax_web:
  pax_loader_id: ${pax_loader_id}
  port: 8080
