# Experimental public PAX profile. Hardware testing pending.
substitutions:
  device_name: pax-firebeetle2
  friendly_name: DFRobot FireBeetle 2 ESP32-P4 HDMI
  launcher_network_url: http://192.168.1.2:8000/launcher_ui.pax
  launcher_github_url: https://nonasuomy.github.io/esphomebrew/install/sd/launcher_ui.pax
  pointer_dimensions: (1280, 720)
  panel_width: '1280'
  panel_height: '720'
  canvas_width: '1024'
  canvas_height: '600'
  button_width: '270'
  button_height: '150'
  storage_x: '117'
  network_x: '504'
  github_x: '891'
  storage_y: '285'
  network_y: '285'
  github_y: '285'

packages:
  pax_base: !include packages/pax-base.yaml
  hardware: !include boards/dfrobot/firebeetle2-hdmi720.yaml

esphome:
  name_add_mac_suffix: true
  project:
    name: nonasuomy.pax
    version: "2026.10.11"

wifi:
  ap:
    ssid: "PAX firebeetle2 Setup"
    password: "pax-setup"
captive_portal:
