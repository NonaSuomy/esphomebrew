# PAX profile: shared launcher plus board hardware.
substitutions:
  idf_source: !env_var PAX_IDF_SOURCE
  idf_compat_script: !env_var PAX_IDF_COMPAT
  device_name: esp32-p4-waveshare-pax-quick
  friendly_name: "ESP32-P4 Waveshare 7-inch PAX Quick Launcher"
  launcher_network_url: "http://10.20.30.158:8000/launcher_ui.pax"

# Retain the ESPHome API actions for saving PAXs and arbitrary files to /sd.

packages:
  pax_base: !include packages/pax-base.yaml
  hardware: !include boards/waveshare/wifi6-7inch.yaml
  pax_audio: !include packages/pax-audio.yaml

wifi:
  ssid: !secret pax_hosted_wifi_ssid
  password: !secret pax_hosted_wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ESP32-P4-Fallback"
    password: !secret pax_hosted_fallback_password
