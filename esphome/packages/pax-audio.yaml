# Shared PAX mixer/resampler chain. Board supplies speaker_output.
speaker:
  - platform: mixer
    id: mixing_speaker
    output_speaker: speaker_output
    num_channels: 2
    # Quake's PAX arena consumes almost all PSRAM; keep the mixer task in
    # internal RAM so the audio chain can still start while the game runs.
    task_stack_in_psram: false
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16


pax_loader:
  speaker_id: media_resampling_speaker
