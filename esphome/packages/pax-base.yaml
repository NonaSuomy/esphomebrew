text_sensor:
  - platform: usb_hidx
    type: keyboard
    id: pax_keyboard
    internal: true


logger:
  level: DEBUG
  initial_level: INFO
  hardware_uart: UART0
  logs:
    esp32.preferences: DEBUG


api:
  reboot_timeout: 0s


ota:
  - platform: esphome

# Remote diagnostics and launcher input stay out of the on-screen UI; they
# preserve the three visible launcher choices while enabling screenshot QA.

button:
  - platform: template
    name: "Remote Close PAX"
    id: remote_close_pax
    on_press:
      - lambda: id(pax_runtime)->request_close();
  - platform: template
    name: "Remote Enable Screen Stream"
    id: remote_enable_screen_stream
    on_press:
      - lambda: id(pax_runtime)->request_screen_stream();
  - platform: template
    name: "Remote Capture Screenshot"
    id: remote_capture_screenshot
    on_press:
      - lambda: id(pax_runtime)->request_screenshot();


time:
  - platform: sntp
    id: sntp_time
    timezone: "America/Toronto"
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org


improv_serial:
  next_url: "http://{{ip_address}}:8080/pax"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - pax_launcher_pointer.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          static esphome::pax_launcher::Pointer pointer${pointer_dimensions};
          auto *mouse = lv_indev_create();
          lv_indev_set_type(mouse, LV_INDEV_TYPE_POINTER);
          lv_indev_set_display(mouse, id(lvgl_component)->get_disp());
          lv_indev_set_group(mouse, lv_group_get_default());
          lv_indev_set_read_cb(mouse, [](lv_indev_t *, lv_indev_data_t *data) {
            const bool enabled = !id(lvgl_component)->is_paused() && !id(pax_runtime)->is_loading();
            data->point.x = pointer.x;
            data->point.y = pointer.y;
            data->state = pointer.pressed(enabled) ? LV_INDEV_STATE_PRESSED : LV_INDEV_STATE_RELEASED;
          });
          auto *cursor = lv_label_create(lv_layer_top());
          lv_label_set_text(cursor, "+");
          lv_obj_set_style_text_color(cursor, lv_color_hex(0xFFFFFF), 0);
          lv_obj_set_style_text_font(cursor, &lv_font_montserrat_20, 0);
          lv_obj_remove_flag(cursor, LV_OBJ_FLAG_CLICKABLE);
          lv_obj_remove_flag(cursor, LV_OBJ_FLAG_SCROLLABLE);
          lv_indev_set_cursor(mouse, cursor);
          id(pax_mouse_x)->add_on_state_callback([](float dx) {
            pointer.move(dx, 0, !id(lvgl_component)->is_paused() && !id(pax_runtime)->is_loading());
          });
          id(pax_mouse_y)->add_on_state_callback([](float dy) {
            pointer.move(0, dy, !id(lvgl_component)->is_paused() && !id(pax_runtime)->is_loading());
          });
          id(pax_mouse_left)->add_on_state_callback([](bool down) {
            pointer.button(down, !id(lvgl_component)->is_paused() && !id(pax_runtime)->is_loading());
          });
          ESP_LOGI("quick_launcher", "USB touchpad pointer and keyboard navigation ready");
  platformio_options:
    extra_scripts:
      - ${idf_compat_script}
    build_flags:
      - -DADC_ATTEN_DB_11=ADC_ATTEN_DB_12
      - -DLV_USE_SNAPSHOT=1
      - -Wno-error
      - -Wno-error=format
      - -Wno-error=implicit-fallthrough
      - -Wno-error=missing-field-initializers
      - -Wno-error=old-style-definition


esp32:
  toolchain: platformio
  variant: esp32p4
  framework:
    type: esp-idf
    version: 6.1.0
    source: ${idf_source}
    platform_version: https://github.com/pioarduino/platform-espressif32.git#6432eb84bf5be32d536bcb37ed437322abefdee3
    advanced:
      # Launcher Settings layout exceeds the default 8 KB loop stack.
      loop_task_stack_size: 16384
      enable_idf_experimental_features: true
      disable_vfs_support_dir: false
      include_builtin_idf_components:
        - fatfs
        - wear_levelling
        - esp_adc
    sdkconfig_options:
      # IDF 6.1 selects instruction/rodata relocation through this option.
      # Keep PSRAM accessible during flash writes, including preference saves.
      CONFIG_SPIRAM_XIP_FROM_PSRAM: "y"
      CONFIG_ESP32_SPIRAM_SUPPORT: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_SPEED_200M: "y"
      CONFIG_SPIRAM_SPEED: "200"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_LFN_STACK: "y"
      # One volume is occupied by the SD card; reserve the second for USB MSC.
      CONFIG_FATFS_VOLUME_COUNT: "2"
      CONFIG_FATFS_FS_EXFAT: "y"
      # Preserve the card-safety behavior of the current firmware.
      CONFIG_FATFS_IMMEDIATE_FSYNC: "y"
      CONFIG_VFS_SUPPORT_IO: "y"
      CONFIG_VFS_SUPPORT_DIR: "y"
      CONFIG_VFS_MAX_COUNT: "16"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_ESP_TIMER_TASK_STACK_SIZE: "4096"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      CONFIG_ESP_TASK_LOOP_STACK_SIZE: "16384"
      CONFIG_LWIP_SOCKET: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL: "y"
      CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY: "y"
      CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC: "n"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"


sensor:
  - platform: usb_hidx
    type: gamepad
    axis: lx
    id: pax_lx
    internal: true
  - platform: usb_hidx
    type: gamepad
    axis: ly
    id: pax_ly
    internal: true
  - platform: usb_hidx
    type: gamepad
    axis: rx
    id: pax_rx
    internal: true
  - platform: usb_hidx
    type: gamepad
    axis: ry
    id: pax_ry
    internal: true
  - platform: usb_hidx
    type: mouse
    x_delta: true
    id: pax_mouse_x
    internal: true
  - platform: usb_hidx
    type: mouse
    y_delta: true
    id: pax_mouse_y
    internal: true
  - platform: usb_hidx
    type: mouse
    wheel: true
    id: pax_mouse_wheel
    internal: true

number:
  - platform: template
    name: "PAX Master Volume"
    id: pax_master_volume
    internal: true
    min_value: 0
    max_value: 100
    step: 5
    initial_value: 70
    restore_value: true
    optimistic: true
    on_value:
      - lambda: id(pax_runtime)->set_master_volume(static_cast<int32_t>(x));

text:
  - platform: template
    name: "Remote PAX Path or URL"
    id: remote_pax_path
    mode: text
    optimistic: true
    on_value:
      - lambda: id(pax_runtime)->request_launch(x);
  - platform: template
    name: "Remote Launcher UI Input"
    id: remote_ui_input
    mode: text
    optimistic: true
    on_value:
      - lambda: id(pax_runtime)->request_remote_ui_input(x);


pax_loader:
  id: pax_runtime
  display_id: main_display
  mipi_dsi_id: main_display
  lvgl_id: lvgl_component
  # LVGL owns USB navigation on the YAML launcher, avoiding duplicate clicks.
  lvgl_keypad_navigation: true
  usb_hidx_id: usb_hidx_component
  sd_mmc_id: sd_card
  usb_msc_id: usb_storage
  path: /sd/roms/pax/launcher_ui.pax
  canvas_width: ${canvas_width}
  canvas_height: ${canvas_height}
  panel_width: ${panel_width}
  panel_height: ${panel_height}
  library_style: grid
  autostart: false
  button_up: pax_dpad_up
  button_down: pax_dpad_down
  button_left: pax_dpad_left
  button_right: pax_dpad_right
  button_select: pax_select
  button_start: pax_start
  button_a: pax_a
  button_b: pax_b
  button_x: pax_x
  button_y: pax_y
  button_l: pax_l
  button_r: pax_r
  fire_button: pax_right_trigger
#  touch_button: pax_touch_button
  left_stick_x_sensor: pax_lx
  left_stick_y_sensor: pax_ly
  right_stick_x_sensor: pax_rx
  right_stick_y_sensor: pax_ry


lvgl:
  id: lvgl_component
  default_group: pax_focus_group
  resume_on_input: false
  use_ppa: false
  buffer_size: 0.15
  update_interval: 33ms
  color_depth: 16
  byte_order: little_endian
  default_font: montserrat_20
  log_level: WARN
  keypads:
    - id: launcher_keyboard_tab
      next: launcher_key_tab
      enter: launcher_key_enter
      initial_focus: storage_button
    - id: launcher_keyboard_horizontal
      next: launcher_key_right
      prev: launcher_key_left
      enter: launcher_key_space
    - id: launcher_keyboard_vertical
      next: launcher_key_down
      prev: launcher_key_up
    - id: launcher_gamepad_horizontal
      next: pax_dpad_right
      prev: pax_dpad_left
      enter: pax_a
      esc: pax_b
    - id: launcher_gamepad_vertical
      next: pax_dpad_down
      prev: pax_dpad_up
  theme:
    button:
      bg_color: 0x0B2A4A
      bg_opa: 86%
      border_color: 0x1EA7D7
      border_width: 2
      radius: 14
      text_color: 0xD7F3FF
      focused:
        bg_color: 0x14527A
        bg_opa: 100%
        border_color: 0x55D6FF
        border_width: 4
        outline_color: 0x38BDF8
        outline_width: 2
  pages:
    - id: quick_launch_page
      width: ${panel_width}
      height: ${panel_height}
      scrollable: false
      scrollbar_mode: "OFF"
      bg_color: 0x061326
      bg_opa: COVER
      on_load:
        - lambda: |-
            if (auto *group = lv_group_get_default()) {
              lv_group_add_obj(group, id(storage_button));
              lv_group_add_obj(group, id(network_button));
              lv_group_add_obj(group, id(github_button));
              lv_group_focus_obj(id(storage_button));
            }
      widgets:
        # The shared PAX loader references these LVGL widget APIs for its
        # runtime overlays and selectors. Keep their support compiled while
        # leaving only the three launch buttons visible on this page.
        - textarea:
            id: hidden_search_stub
            x: 0
            y: 0
            width: 1
            height: 1
            hidden: true
        - keyboard:
            id: hidden_keyboard_stub
            x: 0
            y: 0
            width: 1
            height: 1
            hidden: true
            textarea: hidden_search_stub
            mode: text_lower
        - list:
            id: hidden_list_stub
            x: 0
            y: 0
            width: 1
            height: 1
            hidden: true
        - slider:
            id: hidden_slider_stub
            x: 0
            y: 0
            width: 1
            height: 1
            hidden: true
            min_value: 0
            max_value: 100
        - button:
            id: storage_button
            width: ${button_width}
            height: ${button_height}
            x: ${storage_x}
            y: ${storage_y}
            on_click:
              - lambda: id(pax_runtime)->request_launch("/sd/roms/pax/launcher_ui.pax");
            widgets:
              - label:
                  text: "STORAGE"
                  align: CENTER
                  text_font: montserrat_20
                  text_color: 0xD7F3FF
        - button:
            id: network_button
            width: ${button_width}
            height: ${button_height}
            x: ${network_x}
            y: ${network_y}
            on_click:
              - lambda: id(pax_runtime)->request_launch("${launcher_network_url}");
            widgets:
              - label:
                  text: "NETWORK"
                  align: CENTER
                  text_font: montserrat_20
                  text_color: 0xD7F3FF
        - button:
            id: github_button
            width: ${button_width}
            height: ${button_height}
            x: ${github_x}
            y: ${github_y}
            on_click:
              - lambda: id(pax_runtime)->request_launch("${launcher_github_url}");
            widgets:
              - label:
                  text: "GITHUB STORE"
                  align: CENTER
                  text_font: montserrat_20
                  text_color: 0xD7F3FF

