# Shared three-button PAX firmware. Hardware belongs in boards/.
substitutions:
  idf_source: !env_var PAX_IDF_SOURCE
  idf_compat_script: !env_var PAX_IDF_COMPAT
  launcher_network_url: "http://192.168.1.2:8000/launcher_ui.pax"
  launcher_github_url: "https://nonasuomy.github.io/esphomebrew/install/sd/launcher_ui.pax"
  pointer_dimensions: ""
  canvas_width: "1024"
  canvas_height: "600"
  panel_width: "1024"
  panel_height: "600"
  button_width: "270"
  button_height: "150"
  storage_y: "225"
  network_y: "225"
  github_y: "225"
  storage_x: "70"
  network_x: "377"
  github_x: "684"

packages:
  pax_control: !include ../device_control.yaml

safe_mode:
  disabled: true


psram:
  mode: hex
  speed: 200MHz


external_components:
  - source:
      type: local
      path: dependencies/esphome/config/components
    components: [font, lvgl, sd_mmc_card, usb_hidx, ethernet, i2s_audio, ledc, mipi_dsi]
  - source:
      type: local
      path: components
    components: [define_fixup, usb_msc]
  - source:
      type: local
      path: components
    components: [pax_loader, pax_web]


define_fixup:


usb_host:
  enable_hubs: true


usb_msc:
  id: usb_storage


usb_hidx:
  id: usb_hidx_component
  hub: true
  drivers:
