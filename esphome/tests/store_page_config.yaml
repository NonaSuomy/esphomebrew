# CI config check for esphome/store_page.yaml, esphome/device_control.yaml
# and the pax_loader schema.
# Not a real device: any board with a display, touchscreen and network will do,
# because `esphome config` only validates. Run: esphome config esphome/tests/store_page_config.yaml
substitutions:
  pax_font_small: montserrat_12

esphome:
  name: pax-store-config-check

esp32:
  board: esp32-s3-devkitc-1
  framework: {type: esp-idf}

psram:
  mode: octal

wifi:
  ssid: config-check
  password: config-check

logger:

api:
  encryption:
    key: "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="

spi:
  clk_pin: 12
  mosi_pin: 11
  miso_pin: 13

display:
  - platform: ili9xxx
    id: main_display
    model: ILI9341
    cs_pin: 10
    dc_pin: 9
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch_panel
    cs_pin: 14
    calibration: {x_min: 280, x_max: 3860, y_min: 340, y_max: 3860}

external_components:
  - source: {type: local, path: ../components}
    components: [pax_loader]

pax_loader:
  id: pax_runtime
  path: /sd/roms/pax/app.pax
  display_id: main_display
  touchscreen_id: touch_panel
  lvgl_id: lvgl_component
  catalog_url: https://nonasuomy.github.io/esphomebrew/
  data_root: /sd
  download_data: true
  data_search: [/sd, /usb0]

lvgl:
  id: lvgl_component
  pages:
    - id: main_page
      widgets:
        - button:
            widgets:
              - label: {text: "STORE"}
            on_click:
              - lvgl.page.show: pax_store_page

packages:
  pax_store: !include ../store_page.yaml
  pax_control: !include ../device_control.yaml
